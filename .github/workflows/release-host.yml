# release-host.yml — publish the magpie HOST-SERVICE release tarballs,
# one per architecture.
#
# WHAT THIS DOES
#   On a `v*` release tag (e.g. `v0.4.0`) this builds the two host systemd
#   services — @magpie/orchestrator and @magpie/gateway — compiles their
#   TypeScript, builds the native per-arch `magpie-tier-probe` KVM preflight
#   binary (static-musl, natively per arch — same approach as rust.yml),
#   packages prebuilt `dist/**` + the probe + a lockfile pruned to exactly those
#   two workspaces via `scripts/pack-host.sh`, attaches SLSA build provenance,
#   and publishes ONE GitHub Release carrying BOTH per-arch tarballs.
#
# PER-ARCH
#   The tarball bundles the native `magpie-tier-probe` binary, which is
#   per-arch, so the host artifact is NO LONGER architecture-independent. The
#   `build` job is a matrix (linux/amd64 on ubuntu-24.04, linux/arm64 on
#   ubuntu-24.04-arm), each producing `magpie-<version>-<arch>.tar.gz`; a final
#   `release` job collects both into a single Release. The probe is built
#   natively per arch (no musl cross-linker), mirroring rust.yml. The micro-VM
#   launcher (magpie-microvm-launcher) is deliberately NOT built/bundled here —
#   it dynamically links host libkrun (see rust.yml) and is an operator
#   build-from-source step (INSTALL.md).
#
# HOST-SERVICES-ONLY SCOPE
#   The reviewer is the ONLY container in the product and is published
#   separately by release-reviewer.yml on the `reviewer-v*` tag namespace (see
#   DISTRIBUTION.md §2/§3.1). This workflow triggers ONLY on the plain `v*`
#   tag namespace, which does NOT match `reviewer-v*` — the two release
#   pipelines never collide or re-publish each other's artifact.
#
# PROVENANCE
#   `actions/attest-build-provenance` records a signed SLSA provenance
#   attestation for each tarball via GitHub's Sigstore-backed attestations API
#   (the same keyless/OIDC model release-reviewer.yml uses for the image).
#   Adopters verify with:
#     gh attestation verify magpie-<version>-<arch>.tar.gz --repo andrew-craig/magpie

name: release-host

on:
  push:
    tags:
      - "v*"
  # Manual runs (e.g. a dry-run build off a branch). Note: with no tag,
  # VERSION falls back to the root package.json version, and the release
  # step is skipped (guarded on `refs/tags/`) — a workflow_dispatch run only
  # builds and uploads the workflow artifact, it never publishes a Release.
  workflow_dispatch:

permissions:
  contents: write # checkout + create the GitHub Release
  id-token: write # OIDC token for build provenance attestation
  attestations: write # actions/attest-build-provenance

jobs:
  # Per-arch build: each runs natively on its own architecture so the
  # static-musl magpie-tier-probe links without a cross-linker (mirrors
  # rust.yml's matrix), and produces magpie-<version>-<arch>.tar.gz.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm to the version pack-host.sh's lockfile pruning is validated
      # against. `npm install --package-lock-only` garbage-collects the
      # now-unreferenced review-extension dependency subtree only on npm >= 11;
      # the npm 10 that ships with Node 22 leaves @earendil-works/* entries in
      # the pruned lockfile, which pack-host.sh's leakage guard (correctly)
      # rejects. Pinning here makes CI reproduce the version the release is
      # built + verified with locally.
      - name: Pin npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build orchestrator
        run: npm run build

      - name: Build gateway
        run: npm run gateway:build

      # Build the native per-arch KVM preflight probe (static-musl), the same
      # binary rust.yml's `build` matrix produces — built here natively so a
      # `v*` host-release tag (which does NOT trigger rust.yml's `rust-v*` lane)
      # still gets a probe to bundle, with no reliance on a cross-workflow
      # artifact. Only this one crate is built (the launcher is excluded — it
      # needs host libkrun, see rust.yml).
      - name: Install pinned Rust toolchain + musl target
        working-directory: rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build magpie-tier-probe (static-musl)
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }} -p magpie-tier-probe

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack host release artifact
        env:
          MAGPIE_ARCH: ${{ matrix.arch }}
          MAGPIE_TIER_PROBE_BIN: rust/target/${{ matrix.target }}/release/magpie-tier-probe
        run: bash scripts/pack-host.sh "${{ steps.version.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-release/magpie-*-${{ matrix.arch }}.tar.gz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: magpie-host-${{ matrix.arch }}
          path: |
            dist-release/magpie-*-${{ matrix.arch }}.tar.gz
            dist-release/magpie-*-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "## magpie host-service tarball packaged (${{ matrix.arch }})"
            echo ""
            echo "**Version:** \`${{ steps.version.outputs.version }}\`"
            echo '```'
            ls dist-release/magpie-*-${{ matrix.arch }}.tar.gz
            cat dist-release/magpie-*-${{ matrix.arch }}.tar.gz.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Collect both per-arch tarballs into ONE GitHub Release (tag pushes only).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download per-arch tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: magpie-host-*
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist-release/magpie-*.tar.gz \
            dist-release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "magpie $GITHUB_REF_NAME (host services)" \
            --notes "Host-service release: @magpie/orchestrator + @magpie/gateway, one tarball PER ARCH (each bundles the matching magpie-tier-probe KVM preflight binary — see INSTALL.md). Pick the tarball matching your host's architecture. See INSTALL.md for install steps and DISTRIBUTION.md for the design. The reviewer container is published separately (see docker/reviewer/README.md)."
