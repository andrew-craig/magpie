# ci.yml — TypeScript workspace lint/typecheck/test gate for pull requests.
#
# Runs a floor-invariant regression test: CTO binding edit #3 requires CI to
# fail on any drift of the reviewer's hardened "crun floor" argv from its
# committed golden. That test
# (packages/orchestrator/src/reviewer-crun-floor-argv.test.ts) only actually
# gates merges if a workflow runs the suite on PRs, so this file wires
# `npm test` (vitest across all workspaces) + a typecheck into every PR that
# touches the TypeScript packages.
#
# `docker/reviewer/**` is included in `paths:` for the image-config-drift
# guard: reviewer-microvm-env-parity.test.ts (under packages/orchestrator/src,
# so already covered by the `packages/**` glob below) reads
# docker/reviewer/Dockerfile and docker/reviewer/entrypoint.sh straight off
# disk to assert every Dockerfile `ENV` is covered for the micro-VM tier.
# Without this line, a PR that touched ONLY those two files (e.g. adding a new
# `ENV` with no accompanying packages/ change) would never trigger this
# workflow at all — the test would exist but never actually run on the PR that
# needs it, silently defeating the whole point of the guard.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "docker/reviewer/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "docker/reviewer/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin npm to match the release workflows (see release-host.yml) so
      # lockfile handling is identical across CI jobs.
      - name: Pin npm
        run: npm install -g npm@11.17.0

      - name: Install (clean, from lockfile)
        run: npm ci

      # Typecheck (the orchestrator build is `tsc -p`), then run the full
      # vitest suite across every workspace — this is what makes the
      # crun-floor golden test a real merge gate.
      - name: Typecheck
        run: npm run build

      - name: Test
        run: npm test
