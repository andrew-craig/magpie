# rust.yml — build/lint gate + signing lane for the rust/ cargo workspace
# (RUST-2 / task_2a18).
#
# WHAT THIS DOES
#   `lint` (every push/PR touching rust/**): cargo fmt --check, cargo clippy
#   -D warnings, cargo test --workspace. This is the Rust-side equivalent of
#   the existing TS lint/test gate — see package.json for that half.
#
#   `build`: release, statically-linked builds of the whole workspace for
#   both product target arches. To avoid a musl cross-linker (and the
#   "prebuilt third-party binary" supply-chain smell that comes with
#   fetching one), each target builds NATIVELY on a GitHub-hosted runner of
#   its own architecture — linux/amd64 on `ubuntu-24.04`, linux/arm64 on
#   `ubuntu-24.04-arm` — rather than cross-compiling from a single runner.
#   Every dependency (including the toolchain, pinned by rust-toolchain.toml)
#   is fetched from its own pinned source and compiled in this job; nothing
#   shipped in the final binaries is a fetched prebuilt artifact.
#
#   `sign` (tag `rust-v*` or manual dispatch only): cosign KEYLESS-signs
#   (GitHub OIDC -> Fulcio, Rekor-logged — same model release-reviewer.yml
#   uses for the image, no long-lived signing keys) every binary this
#   workflow produces, and uploads the signatures as a workflow artifact.
#
#   `boundary-contract` (RUST-3 / task_9d2b, needs `build`): runs
#   packages/orchestrator/src/relay-boundary.test.ts — the cross-language
#   TCP-facing relay contract shared by docker/reviewer/forwarder.mjs and
#   rust/vsock-client's magpie-vsock-client (see that test file's own doc
#   comment and docs/design/rust-adoption.md's migration rule) — with
#   MAGPIE_RELAY_IMPL=rust against the REAL x86_64-unknown-linux-musl binary
#   this workflow just built (downloaded from `build`'s artifact; runs
#   natively on the same ubuntu-24.04 arch, no cross-arch emulation needed).
#   This is what makes "a swap PR must keep the boundary suite green with
#   zero test edits" an enforced CI property rather than an aspiration.
#
# SCOPE NOTE (read before wiring this into a real release)
#   Today `rust/` holds the scaffolding crates (`vsock-framing`, the
#   `magpie-vsock-client` placeholder) plus the production host-side libkrun
#   launcher (`magpie-microvm-launcher`, task_76d6) plus the production
#   install-time/runtime KVM preflight (`magpie-tier-probe`, M8-D1 /
#   task_2f46) — see docs/design/rust-adoption.md. Per that doc, a binary
#   BAKED INTO the reviewer image is already covered by the image's digest
#   pin + cosign signature and does not need signing here again; this
#   workflow's `sign` job is for binaries shipped OUTSIDE the image.
#   `magpie-tier-probe` IS one of those — it's a real, shippable artifact
#   (the M8-D3 installer runs it directly, with no Node in the loop; the
#   orchestrator shells out to the same binary at startup — see
#   packages/orchestrator/src/tier-ladder.ts), not merely a lane-proving
#   placeholder like `magpie-vsock-client` still is today. Wiring the real
#   guest-side client (task_2d6c) into docker/reviewer/Dockerfile, and both
#   external binaries into scripts/pack-host.sh + release-host.yml, is
#   future work (M8-D3 / task_67aa for `magpie-tier-probe` specifically).
#
#   `magpie-microvm-launcher` is DELIBERATELY EXCLUDED from every job below
#   (`lint`'s clippy/test, `build`'s static-musl matrix). Unlike every other
#   member, it dynamically links a HOST-INSTALLED `libkrun.so` (see that
#   crate's Cargo.toml/build.rs doc comments) — a runtime dependency that
#   isn't present on generic GitHub-hosted runners, so `cargo build`/`test`/
#   `clippy` would fail at link time trying to build it here, and it has no
#   static-musl form to belong in the `build` matrix at all (there is no
#   static build of libkrun to link against). `cargo fmt --check` still
#   covers it (rustfmt never links). Building/testing it for real needs a
#   libkrun-equipped, `/dev/kvm`-capable host — see that crate's
#   `smoke-test.sh` for the closest thing to a CI-shaped run today. Wiring a
#   dedicated self-hosted runner for it is future work (tracked informally
#   against whichever task next touches this launcher — e.g. task_39ff).

name: rust

on:
  push:
    branches: ["**"]
    # `paths` only meaningfully filters ordinary branch pushes here — new
    # tag refs (our `rust-v*` release tags) have no prior git state to diff
    # against, so GitHub runs the workflow on tag creation regardless of
    # which paths changed. That's intentional: a release tag must always
    # get its lint/build/sign run, never be silently skipped by this filter.
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      # The boundary-contract job's suite and the forwarder.mjs it's proven
      # against — see that job's comment above. A change to either must also
      # re-run this workflow, not just ci.yml's default (node-impl-only) run.
      - "packages/orchestrator/src/relay-boundary.test.ts"
      - "docker/reviewer/forwarder.mjs"
    tags:
      - "rust-v*"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - "packages/orchestrator/src/relay-boundary.test.ts"
      - "docker/reviewer/forwarder.mjs"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rustup (preinstalled on GitHub-hosted runners) reads rust/rust-toolchain.toml
      # and installs the pinned channel + targets + components on first use;
      # `rustup show` forces that install up front so it's not hidden inside
      # the first cargo invocation's timing.
      - name: Install pinned toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        # --exclude magpie-microvm-launcher: see this file's top-of-file
        # SCOPE NOTE — that crate dynamically links a host-only libkrun.so
        # not present on this runner.
        run: cargo clippy --workspace --exclude magpie-microvm-launcher --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude magpie-microvm-launcher

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned toolchain + target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: cargo build --release
        # --exclude magpie-microvm-launcher: see this file's top-of-file
        # SCOPE NOTE — it dynamically links libkrun and has no static-musl
        # form, so it does not belong in this static-binary release matrix.
        run: cargo build --release --workspace --exclude magpie-microvm-launcher --target ${{ matrix.target }}

      # Fail closed if a future dependency (e.g. once task_2d6c/task_76d6
      # land) accidentally drags in a dynamically-linked libc — the whole
      # point of the musl targets is a fully static, portable binary.
      #
      # Keyed off `file`'s structural classification, NOT `ldd`'s exact
      # wording: the two musl targets legitimately produce DIFFERENT static
      # forms — aarch64 emits a plain "statically linked" ELF while x86_64
      # emits a "static-pie linked" one — and both are fully static. The
      # earlier `ldd | grep -v 'not a dynamic executable'` check false-
      # positived on the static-PIE binary (its `ldd` output differs) and
      # could false-negative on empty `ldd` output; `file` avoids both. We
      # accept either static form and reject only a genuinely dynamic binary,
      # failing closed on any unexpected classification.
      - name: Verify static linking
        run: |
          set -euo pipefail
          for bin in target/${{ matrix.target }}/release/*; do
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            desc=$(file "$bin")
            echo "$desc"
            case "$desc" in
              *"dynamically linked"*)
                echo "::error::$bin is dynamically linked"; exit 1 ;;
              *"statically linked"*|*"static-pie linked"*)
                : ;; # fully static — either plain or PIE form is fine
              *)
                echo "::error::$bin: unexpected linkage classification (not confirmed static)"; exit 1 ;;
            esac
          done

      # `path:` for actions/upload-artifact is repo-root-relative (the
      # `defaults.run.working-directory: rust` above only applies to `run:`
      # shell steps, not action inputs), hence the explicit `rust/` prefix.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries-${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/magpie-vsock-client
            rust/target/${{ matrix.target }}/release/magpie-tier-probe
          if-no-files-found: error
          retention-days: 14

  # boundary-contract (RUST-3 / task_9d2b) — see the top-of-file "WHAT THIS
  # DOES" note. Runs on ubuntu-24.04 (linux/amd64, same arch `build`'s
  # x86_64-unknown-linux-musl leg targets) so the downloaded static binary
  # executes natively with no emulation. This job (not `lint`/`build`) is the
  # actual CI enforcement of docs/design/rust-adoption.md's migration rule:
  # relay-boundary.test.ts must stay green, unedited, against the real
  # compiled binary.
  boundary-contract:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin npm to match ci.yml/release-host.yml so lockfile handling is identical.
      - name: Pin npm
        run: npm install -g npm@11.17.0

      # Explicit working-directory: this job drives the npm workspace at the
      # repo root, overriding the workflow-level `defaults.run.working-directory:
      # rust` (which only makes sense for the cargo-based jobs above).
      - name: Install (clean, from lockfile)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Download the x86_64-unknown-linux-musl binary built by `build`
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries-x86_64-unknown-linux-musl
          path: rust-binaries

      # actions/download-artifact doesn't preserve the executable bit.
      - name: Make binary executable
        working-directory: ${{ github.workspace }}
        run: chmod +x rust-binaries/magpie-vsock-client

      - name: Run the relay-boundary contract suite against the real Rust binary
        working-directory: packages/orchestrator
        env:
          MAGPIE_RELAY_IMPL: rust
          MAGPIE_VSOCK_CLIENT_BIN: ${{ github.workspace }}/rust-binaries/magpie-vsock-client
        run: npx vitest run src/relay-boundary.test.ts

  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rust-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for cosign keyless signing
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rust-binaries-*
          path: artifacts
          merge-multiple: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless sign-blob: mints a short-lived Fulcio cert off this workflow's
      # OIDC identity and logs the signature in Rekor — no stored secrets.
      # Adopters verify with:
      #   cosign verify-blob \
      #     --certificate-identity-regexp '^https://github.com/andrew-craig/magpie' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --signature <bin>.sig --certificate <bin>.pem <bin>
      - name: Sign externally-shipped binaries (keyless)
        working-directory: artifacts
        run: |
          set -euo pipefail
          for dir in rust-binaries-*; do
            for bin in "$dir"/*; do
              [ -f "$bin" ] || continue
              echo "Signing $bin"
              cosign sign-blob --yes \
                --output-signature "$bin.sig" \
                --output-certificate "$bin.pem" \
                "$bin"
            done
          done

      - name: Upload signatures
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-signatures
          path: |
            artifacts/**/*.sig
            artifacts/**/*.pem
          if-no-files-found: error
          retention-days: 90
