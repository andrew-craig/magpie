# Magpie's Rust cargo workspace (RUST-2 / task_2a18).
#
# Scope: see docs/design/rust-adoption.md "Build & signing". This workspace
# exists alongside the npm workspaces at the repo root; it is the build lane
# for Magpie's native (Rust) process-boundary components — today the
# scaffolding crates (`vsock-framing`, `vsock-client`) plus the production
# host-side libkrun launcher (`magpie-microvm-launcher`, task_76d6). The
# guest-side vsock client (task_2d6c) still needs to land in `vsock-client`.
#
# NOTE on `magpie-microvm-launcher`: unlike the other members, it dynamically
# links a HOST-installed `libkrun.so` (see its Cargo.toml/build.rs doc
# comments) rather than building fully static. It is a workspace member for
# local dev / `cargo metadata` convenience, but `.github/workflows/rust.yml`
# deliberately EXCLUDES it from the shared workspace-wide lint/build steps
# (which run on generic GitHub-hosted runners that don't have libkrun
# installed) — see that file's comments for the excluded commands and why.
[workspace]
resolver = "2"
members = [
    "vsock-framing",
    "vsock-client",
    "magpie-microvm-launcher",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

# Reproducible, minimal release builds for the static-musl binaries shipped
# out of this workspace. Profiles can only be set at the workspace root, so
# member crates inherit this rather than declaring their own [profile.*].
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
